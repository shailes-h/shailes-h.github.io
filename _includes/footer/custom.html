<!-- start custom footer snippets -->

<a class="page__footer-sitemap" href="/sitemap/">Sitemap</a>

<!-- Support for MatJax -->
<script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>

<!-- Support for Plotly -->
<script defer src='https://cdnjs.cloudflare.com/ajax/libs/plotly.js/3.0.1/plotly.min.js'></script>

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

{% if site.visitor_map_url %}
<script defer src="{{ site.visitor_map_url }}/tracker.js" data-visitor-map-tracker></script>
<div class="page__footer-map">
    <a
      class="visitor-map-link"
      href="{{ site.visitor_map_url }}/?theme=light"
      title="Open visitor statistics"
      target="_blank"
      rel="noopener noreferrer"
      data-visitor-map-link
    >
      <img
        class="visitor-map-image"
        src="{{ site.visitor_map_url }}/map.svg?track=0&amp;theme=light"
        alt="Visitor map"
        width="640"
        height="330"
        loading="lazy"
        decoding="async"
        referrerpolicy="strict-origin-when-cross-origin"
        data-visitor-map-image
      />
    </a>
</div>
{% endif %}
<!-- end custom footer snippets -->
